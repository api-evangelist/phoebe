aid: phoebe
name: Coral
description: 'Coral is a local-first SQL runtime that gives AI agents governed, read-only
  access to data across any API, database, or file system using standard SQL — no custom
  integrations, ETL, or glue code required. Built by Phoebe Technology Limited (a GV /
  Google Ventures portfolio company incorporated in England and Wales, formerly branded
  Phoebe at phoebe.ai), Coral translates SQL into API calls or file reads and returns a
  single result set, handling authentication, authorization, pagination, rate limiting,
  and schema mapping automatically. It ships 25+ bundled sources (GitHub, GitLab, Slack,
  Datadog, Linear, Sentry, Jira, Stripe, PagerDuty, Notion, Grafana, Confluence and more),
  supports cross-source SQL JOINs executed locally, and exposes the same runtime over the
  Model Context Protocol (MCP) or a CLI. Coral is open-source (Apache-2.0), self-hosted so
  queries and data never leave your infrastructure, and ISO 27001:2022 certified / GDPR
  compliant.'
